name: Guardian Failure Notifier

on:
  workflow_run:
    workflows: [Guardian]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update one failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Guardian verification is failing';
            const body = `Guardian failed for ${context.payload.workflow_run.head_sha}.\n\nRun: ${context.payload.workflow_run.html_url}\n\nNo code was changed or deployed automatically.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
