name: Guardian

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root tooling
        run: npm ci
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Verify secrets, code, tests, design, build, and production artifact
        run: npm run verify

  # Deployment is deliberately absent. A green build is evidence, not permission to publish.
