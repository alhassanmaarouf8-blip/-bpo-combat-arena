<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — OMNI-PERFORM</title>
<meta name="description" content="Tips for passing German-speaking BPO and call-center interviews — real structures, phone-listening, and interview practice.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="OMNI-PERFORM — German BPO Interview Tips">
<meta property="og:description" content="Practical tips for passing German-speaking call-center interviews.">
<meta property="og:image" content="/og.png">
<style>
  :root{--bg:#0b1220;--card:#111a2e;--ink:#e2e8f0;--head:#f8fafc;--muted:#94a3b8;--accent:#fb923c;--line:#1e293b;--blue:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  nav a{margin-right:16px;font-size:14px;color:var(--accent);text-decoration:none}
  nav a:hover{text-decoration:underline}
  header.hd{margin:28px 0 8px}
  h1{font-size:30px;color:var(--head);margin:0 0 6px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 28px}
  article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin:0 0 18px}
  article h2{font-size:20px;color:var(--head);margin:0 0 4px;line-height:1.3}
  article .date{color:var(--blue);font-size:13px;margin:0 0 12px;letter-spacing:.02em}
  article p{margin:0 0 12px}
  article p:last-child{margin-bottom:0}
  .empty,.err{color:var(--muted);text-align:center;padding:40px 0}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<main>
  <nav><a href="/">← App</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a></nav>
  <header class="hd">
    <h1>OMNI-PERFORM Blog</h1>
    <p class="sub">Practical tips for passing German-speaking BPO &amp; call-center interviews.</p>
  </header>
  <div id="posts"><p class="empty">Loading…</p></div>
  <footer>Ready to practice for real? <a href="/">Start a live interview →</a></footer>
</main>
<script>
  // Escape any post text before inserting — content is generated, so never trust it as HTML.
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function paras(body){
    return String(body).split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean)
      .map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
  }
  function fmtDate(d){
    try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
    catch(e){return esc(d);}
  }
  fetch('/posts.json?t='+Date.now())
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(data=>{
      const posts=Array.isArray(data)?data:(data&&data.posts)||[];
      const el=document.getElementById('posts');
      if(!posts.length){el.innerHTML='<p class="empty">No posts yet — check back soon.</p>';return;}
      el.innerHTML=posts.map(p=>
        '<article><h2>'+esc(p.title||'Untitled')+'</h2>'+
        (p.date?'<p class="date">'+esc(fmtDate(p.date))+'</p>':'')+
        paras(p.body||'')+'</article>'
      ).join('');
    })
    .catch(()=>{document.getElementById('posts').innerHTML='<p class="err">Couldn’t load posts right now. Please refresh.</p>';});
</script>
</body>
</html>
