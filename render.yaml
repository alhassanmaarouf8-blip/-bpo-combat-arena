# Render Blueprint for the OMNI-PERFORM server (the client is deployed separately on Vercel).
# The runtime app lives in server/. If the Render service builds at the repo root it installs
# only repository verification tooling, not the backend dependencies. This pins the correct
# runtime directory. If the service is Blueprint-linked, Render applies this on sync; otherwise set the
# same values by hand in the dashboard (Root Directory = server, Auto-Deploy = Yes, Branch = main).
services:
  - type: web
    name: bpo-combat-arena
    runtime: node
    plan: free
    branch: main
    autoDeploy: false
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    # Durable storage: without DATABASE_URL the app falls back to JSON files on Render's
    # EPHEMERAL free disk, so every redeploy/restart/cold-start WIPES all users, progress,
    # SRS and feedback. This injects the managed Postgres connection string (internal host,
    # no SSL — db.js auto-detects). store.js / auth.js / feedback.js switch to durable mode
    # automatically once this is set.
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://bpo-combat-arena.vercel.app
      - key: APP_URL
        value: https://bpo-combat-arena.vercel.app
      - key: AUTH_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PAYMENT_MONITOR_KEY
        sync: false
      - key: VODAFONE_CASH_NUMBER
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bpo-combat-db
          property: connectionString

databases:
  - name: bpo-combat-db
    plan: free
    databaseName: bpo_combat
    user: bpo_combat
